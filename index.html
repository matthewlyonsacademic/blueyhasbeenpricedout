<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Perth Housing Affordability Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet map centered on Perth, WA
    var map = L.map('map').setView([-31.9505, 115.8605], 10);

    // Add OpenStreetMap basemap tiles
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ' }).addTo(map);
    

    // Fetch and load your uploaded GeoJSON file
    fetch('Perth_Housing_Affordability_SAL2021.geojson')
      .then(response => response.json())
      .then(data => {
        var geojsonLayer = L.geoJson(data, {
          style: function(feature) {
            return {
              color: "#3388ff",
              weight: 2,
              opacity: 0.8,
              fillColor: "#3388ff",
              fillOpacity: 0.35
            };
          },
          onEachFeature: function (feature, layer) {
            // Generates popups containing all attribute information
            if (feature.properties) {
              var popupText = "";
              for (var key in feature.properties) {
                popupText += "<b>" + key + ":</b> " + feature.properties[key] + "<br>";
              }
              layer.bindPopup(popupText);
            }
          }
        }).addTo(map);

        // Auto-fit map boundaries around the Perth GeoJSON region
        map.fitBounds(geojsonLayer.getBounds());
      })
      .catch(error => console.error('Error loading GeoJSON:', error));
  </script>

</body>
