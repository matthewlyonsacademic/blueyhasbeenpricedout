<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Perth Housing Affordability Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet map centered on Perth, WA
    var map = L.map('map').setView([-31.9505, 115.8605], 10);

    // Add free OpenStreetMap basemap tiles (No API key required)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Fetch and load your GeoJSON file
    fetch('Perth_Housing_Affordability_SAL2021.geojson')
      .then(response => response.json())
      .then(data => {
        var geojsonLayer = L.geoJson(data, {
          style: function(feature) {
            // Pulls the color property directly from your GeoJSON properties
            var fillColor = (feature.properties && feature.properties.color) ? feature.properties.color : '#3388ff';
            return {
              color: "#555555",       // Border color for suburb outlines
              weight: 1,
              opacity: 0.8,
              fillColor: fillColor,   // Uses your dataset's original colors
              fillOpacity: 0.75
            };
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              var popupText = "";
              for (var key in feature.properties) {
                popupText += "<b>" + key + ":</b> " + feature.properties[key] + "<br>";
              }
              layer.bindPopup(popupText);
            }
          }
        }).addTo(map);

        // Auto-fit map boundaries around the Perth region
        map.fitBounds(geojsonLayer.getBounds());
      })
      .catch(error => console.error('Error loading GeoJSON:', error));
  </script>

</body>
</html>

</body>
