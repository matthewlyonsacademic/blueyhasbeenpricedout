<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Perth Housing Affordability Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    var map = L.map('map').setView([-31.9505, 115.8605], 10);

    // Free Esri Light Gray Basemap
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
    }).addTo(map);

    function getSuburbColor(properties) {
      if (!properties) return '#f0f2f5';
      
      if (properties.color && properties.color !== '') {
        return properties.color;
      }
      
      var status = properties.status || properties.Affordability_status || '';
      switch (status) {
        case 'Affordable':
          return '#2b5c8f';
        case 'Unaffordable':
          return '#4a90e2';
        case 'Priced out':
          return '#90caf9';
        case 'Insufficient data / Unassessed':
        default:
          return '#f0f2f5';
      }
    }

    // Load GeoJSON
    fetch('Perth_Housing_Affordability_SAL2021.geojson')
      .then(response => response.json())
      .then(data => {
        var geojsonLayer = L.geoJson(data, {
          style: function(feature) {
            return {
              color: "#666666",
              weight: 0.8,
              opacity: 0.8,
              fillColor: getSuburbColor(feature.properties),
              fillOpacity: 0.85
            };
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              var subName = feature.properties.suburb || feature.properties.SUBURB || 'Unknown';
              var statusText = feature.properties.status || feature.properties.Status || 'N/A';
              
              // Only display suburb name and status
              var popupText = "<b>suburb:</b> " + subName + "<br>" +
                              "<b>status:</b> " + statusText;
                              
              layer.bindPopup(popupText);
            }
          }
        }).addTo(map);

        map.fitBounds(geojsonLayer.getBounds());
      })
      .catch(error => console.error('Error loading GeoJSON:', error));
  </script>

</body>
</html>
